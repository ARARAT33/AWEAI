[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aweai"
version = "2.0.0"
description = "AWEAI — AI Model Factory: create, train, tune and manage AI models from scratch. No built-in AI, no Hugging Face."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ARARAT33" }]
keywords = ["ai", "ml", "model-factory", "training", "numpy", "torch", "from-scratch", "no-huggingface"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=1.13"]
onnx = ["onnx>=1.13"]
sklearn = ["scikit-learn>=1.0"]
ui = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=1.10"]
all = [
    "torch>=1.13",
    "onnx>=1.13",
    "scikit-learn>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=1.10",
    "psutil>=5.9",
]

[project.scripts]
aweai = "aweai.cli:app"

[tool.setuptools.packages.find]
include = ["aweai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
