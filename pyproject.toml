[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aweai"
version = "2.0.0"
description = "AWEAI — the universal AI toolbox: local LLM hub, model creation/fine-tuning, RAG, agents and an automation studio with a 12-language browser UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "llm", "slm", "fine-tuning", "lora", "rag", "agents", "automation", "armenia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Armenian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9",
    "rich>=13",
]

[project.optional-dependencies]
# Lightweight UI stack (no ML frameworks needed)
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "websockets>=12",
]
# Heavy ML stack for real local training / inference / fine-tuning
ml = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "peft>=0.10",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
# RAG vector backends
rag = [
    "chromadb>=0.4",
    "faiss-cpu>=1.7",
]
# Everything
all = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "peft>=0.10",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "chromadb>=0.4",
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
aweai = "aweai.cli:app"

[tool.setuptools.packages.find]
include = ["aweai*"]

[tool.setuptools.package-data]
"aweai.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
