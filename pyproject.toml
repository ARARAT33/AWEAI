[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aweai"
version = "4.0.0"
description = "AWEAI — Universal CLI for AI/ASI/AGI engineering. Pure terminal: create, train, tune and manage AI models + hundreds of CLI commands. No built-in AI, no Hugging Face, no UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ARARAT33" },
]
maintainers = [
    { name = "ARARAT33" },
]
keywords = ["ai", "agi", "asi", "cli", "model-factory", "training", "numpy", "torch", "from-scratch", "no-huggingface", "terminal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "typer>=0.9",
]

[project.optional-dependencies]
torch = ["torch>=1.13"]
onnx = ["onnx>=1.13"]
sklearn = ["scikit-learn>=1.0"]
all = [
    "torch>=1.13",
    "onnx>=1.13",
    "scikit-learn>=1.0",
    "psutil>=5.9",
]

[project.scripts]
aweai = "aweai.cli:app"

[tool.setuptools.packages.find]
include = ["aweai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
