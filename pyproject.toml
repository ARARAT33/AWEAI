[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aweai"
version = "0.1.0"
description = "AWEAI — AI-Worker Engine for Agents & Intelligence: modular Python toolkit for building AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ARARAT33" }]
keywords = ["ai", "assistant", "agent", "llm", "toolkit", "memory", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aweai = "aweai.cli:main"

[tool.setuptools.packages.find]
include = ["aweai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
