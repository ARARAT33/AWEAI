<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWEAI — AI Model Factory</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <!-- ===== Sidebar: the huge menu system ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <span class="logo">🏭</span>
      <div>
        <h1 id="app-name">AWEAI</h1>
        <p id="app-tagline">AI Model Factory · v3.0.0</p>
      </div>
    </div>
    <div class="side-search">
      <input id="global-search" class="input" placeholder="Search 10,000+ commands / 100,000 menus…" autocomplete="off">
      <div id="search-results" class="search-results hidden"></div>
    </div>
    <nav class="side-nav" id="side-nav">
      <!-- main menu groups (huge structure injected by JS) -->
    </nav>
    <div class="side-footer">
      <button id="autotest-btn" class="btn btn-primary btn-block">⚡ Autotest</button>
      <select id="lang-select" class="select"></select>
    </div>
  </aside>

  <!-- ===== Main content ===== -->
  <main class="main">
    <header class="topbar">
      <button id="menu-toggle" class="btn icon-btn" title="Toggle sidebar">☰</button>
      <div class="crumb" id="crumb">Dashboard</div>
      <div class="top-actions">
        <button id="fullscreen-btn" class="btn icon-btn" title="Fullscreen">⛶</button>
        <button id="api-docs-btn" class="btn" title="API docs">📘 API</button>
      </div>
    </header>

    <section class="page" id="page-root">
      <!-- pages injected by JS -->
    </section>
  </main>
</div>

<!-- Terminal drawer -->
<div class="terminal-drawer hidden" id="terminal-drawer">
  <div class="terminal-head">
    <span>💻 In-app terminal — type any AWEAI command</span>
    <button id="term-close" class="btn icon-btn">✕</button>
  </div>
  <div class="terminal-body">
    <div id="term-output" class="term-output"></div>
    <div class="term-input-row">
      <span class="term-prompt">aweai&gt;</span>
      <input id="term-input" class="input term-input" placeholder="e.g. allc --count 20, autoallc, train --type mlp --name demo, market list…" autocomplete="off">
    </div>
  </div>
</div>

<footer class="footer">AWEAI v3.0.0 — AI Model Factory · no Hugging Face · no built-in AI · MIT · 10,000+ CLI commands · 100,000+ UI menus</footer>

<script src="/static/app.js"></script>
</body>
</html>
