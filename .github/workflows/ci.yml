name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest

      - name: Lint compile
        run: python -m compileall -q aweai tests examples scripts

      - name: Import checks (CLI-only, no UI)
        run: |
          python -c "import aweai, aweai.cli, aweai.train, aweai.eval, aweai.rag, aweai.actions, aweai.autotest, aweai.ai, aweai.bulk, aweai.wiki, aweai.cmd; print('imports OK')"
          python -m aweai version
          python -m aweai commands count

      - name: Unit tests
        run: python -m pytest -q

      - name: Autotest (CLI-only)
        run: python -m aweai autotest --quick --no-ui

      - name: No-HuggingFace guard
        run: python .github/scripts/check_hf_free.py
