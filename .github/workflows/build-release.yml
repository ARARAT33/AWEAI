name: Build Release (multi-platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (default: latest pushed tag)"
        required: false
        default: ""

jobs:
  pyinstaller:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows exe
            os: windows-latest
            asset_ext: .exe
            asset_name: aweai-windows-x86_64
          - name: Linux binary
            os: ubuntu-latest
            asset_ext: ""
            asset_name: aweai-linux-x86_64
          - name: macOS app (arm64)
            os: macos-latest
            asset_ext: .app.zip
            asset_name: aweai-macos-arm64
          - name: macOS app (x86_64)
            os: macos-13
            asset_ext: .app.zip
            asset_name: aweai-macos-x86_64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # We install ONLY the core deps (numpy, typer). Heavy optional
      # backends (torch/onnx/sklearn) stay out of the binary so it stays
      # well below the 2 GB Release asset limit; they remain available
      # when installed from pip (pip install aweai[all]). AWEAI is CLI-only.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm aweai.spec

      - name: Smoke-test binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/aweai.exe version
          else
            ./dist/aweai version
          fi

      - name: Package asset
        shell: bash
        run: |
          EXT="${{ matrix.asset_ext }}"
          NAME="${{ matrix.asset_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/aweai.exe "dist/${NAME}${EXT}"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p "dist/${NAME}.app/Contents/MacOS"
            mv dist/aweai "dist/${NAME}.app/Contents/MacOS/aweai"
            chmod +x "dist/${NAME}.app/Contents/MacOS/aweai"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>CFBundleName</key>' \
              '  <string>AWEAI</string>' \
              '  <key>CFBundleDisplayName</key>' \
              '  <string>AWEAI</string>' \
              '  <key>CFBundleIdentifier</key>' \
              '  <string>org.aweai.aweai</string>' \
              '  <key>CFBundleVersion</key>' \
              '  <string>4.0.0</string>' \
              '  <key>CFBundleShortVersionString</key>' \
              '  <string>4.0.0</string>' \
              '  <key>CFBundleExecutable</key>' \
              '  <string>aweai</string>' \
              '  <key>CFBundlePackageType</key>' \
              '  <string>APPL</string>' \
              '</dict>' \
              '</plist>' > "dist/${NAME}.app/Contents/Info.plist"
            (cd dist && zip -qry "${NAME}.app.zip" "${NAME}.app")
          else
            mv dist/aweai "dist/${NAME}${EXT}"
          fi

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/${{ matrix.asset_name }}${{ matrix.asset_ext }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pyinstaller

      - name: Build binary
        run: pyinstaller --clean --noconfirm aweai.spec

      - name: Build AppImage
        run: |
          set -euxo pipefail
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/aweai AppDir/usr/bin/aweai
          chmod +x AppDir/usr/bin/aweai
          cat > AppDir/usr/share/applications/aweai.desktop <<'EOF'
          [Desktop Entry]
          Name=AWEAI
          Comment=AI Model Factory
          Exec=aweai
          Icon=aweai
          Terminal=true
          Type=Application
          Categories=Development;
          EOF
          cp AppDir/usr/share/applications/aweai.desktop AppDir/aweai.desktop
          # Generate a simple PNG icon (no external image libs needed).
          python - <<'PY'
          import struct, zlib
          def chunk(t, d):
              c = t + d
              return struct.pack(">I", len(d)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)
          def png(path, w=256, h=256, rgb=(88, 166, 255)):
              raw = b"".join(b"\x00" + bytes(rgb) * w for _ in range(h))
              data = b"\x89PNG\r\n\x1a\n"
              data += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
              data += chunk(b"IDAT", zlib.compress(raw))
              data += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(data)
          png("AppDir/usr/share/icons/hicolor/256x256/apps/aweai.png")
          png("AppDir/aweai.png")
          PY
          curl -L -o linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          # FUSE-less environment: extract, then run the embedded AppRun.
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null 2>&1
          ./squashfs-root/AppRun --appdir AppDir --output appimage
          ls -la AWEAI-*.AppImage

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            AWEAI-*.AppImage
            aweai-*.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
