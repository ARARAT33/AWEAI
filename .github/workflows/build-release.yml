name: Build Release (multi-platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (default: latest pushed tag)"
        required: false
        default: ""

jobs:
  pyinstaller:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows exe
            os: windows-latest
            asset_ext: .exe
            asset_name: aweai-windows-x86_64
          - name: Linux binary
            os: ubuntu-latest
            asset_ext: ""
            asset_name: aweai-linux-x86_64
          - name: macOS app
            os: macos-latest
            asset_ext: .app.zip
            asset_name: aweai-macos-x86_64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # NOTE: We deliberately install ONLY the core deps (numpy, typer, UI).
      # Installing torch+onnx+scikit-learn makes the PyInstaller binary several
      # GB (torch CUDA wheels alone > 2 GB) which exceeds the GitHub Release
      # asset limit (2 GB). The heavy features (torch training, ONNX export)
      # are optional runtime extras, not required for the packaged CLI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui]" pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm aweai.spec

      - name: Smoke-test binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/aweai.exe version
          else
            ./dist/aweai version
          fi

      - name: Package asset
        shell: bash
        run: |
          EXT="${{ matrix.asset_ext }}"
          NAME="${{ matrix.asset_name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/aweai.exe "dist/${NAME}${EXT}"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # macOS: wrap binary into a .app bundle and zip it so the
            # download is a single portable artifact.
            mkdir -p "dist/${NAME}.app/Contents/MacOS"
            mv dist/aweai "dist/${NAME}.app/Contents/MacOS/aweai"
            chmod +x "dist/${NAME}.app/Contents/MacOS/aweai"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>CFBundleName</key>' \
              '  <string>AWEAI</string>' \
              '  <key>CFBundleDisplayName</key>' \
              '  <string>AWEAI</string>' \
              '  <key>CFBundleIdentifier</key>' \
              '  <string>org.aweai.aweai</string>' \
              '  <key>CFBundleVersion</key>' \
              '  <string>3.0.0</string>' \
              '  <key>CFBundleShortVersionString</key>' \
              '  <string>3.0.0</string>' \
              '  <key>CFBundleExecutable</key>' \
              '  <string>aweai</string>' \
              '  <key>CFBundlePackageType</key>' \
              '  <string>APPL</string>' \
              '</dict>' \
              '</plist>' > "dist/${NAME}.app/Contents/Info.plist"
            (cd dist && zip -qry "${NAME}.app.zip" "${NAME}.app")
          else
            mv dist/aweai "dist/${NAME}${EXT}"
          fi

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/${{ matrix.asset_name }}${{ matrix.asset_ext }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui]" pyinstaller

      - name: Build binary
        run: pyinstaller --clean --noconfirm aweai.spec

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/aweai AppDir/usr/bin/aweai
          chmod +x AppDir/usr/bin/aweai
          curl -L -o linuxdeploy-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          # Run inside a Docker-like FUSE-less environment via --appimage-extract
          ./linuxdeploy-x86_64.AppImage --appimage-extract >/dev/null 2>&1
          ./squashfs-root/AppRun --appdir AppDir \
            --executable AppDir/usr/bin/aweai \
            --output appimage || \
          (echo "linuxdeploy failed; building fallback AppImage" && \
           tar -czf aweai-x86_64.AppImage.tar.gz -C AppDir .)

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            AWEAI-*.AppImage
            aweai-*.AppImage
            aweai-x86_64.AppImage.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-apk:
    name: Android APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Android NDK r26d (compatible with buildozer)
        run: |
          curl -fsSL -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          sudo mkdir -p /opt
          sudo unzip -q /tmp/ndk.zip -d /opt
          ls /opt/android-ndk-r26d | head

      - name: Build APK
        run: bash scripts/build_apk.sh
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found" && exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-build:
    name: Web static build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble static web bundle
        run: |
          mkdir -p dist-web
          cp -r aweai/ui/static/* dist-web/ 2>/dev/null || true
          cat > dist-web/README.txt <<'EOF'
          AWEAI web static build.
          Serve this directory with any static file server:
            python -m http.server 8888
          EOF
          tar -czf aweai-web-static.tar.gz dist-web

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload web build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: aweai-web-static.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
