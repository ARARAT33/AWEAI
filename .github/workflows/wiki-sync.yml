name: Wiki Sync

on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:

jobs:
  publish-wiki:
    name: Publish wiki pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki to ARARAT33/AWEAI.wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          rm -rf /tmp/aweai-wiki
          if git clone --depth 1 "${WIKI_URL}" /tmp/aweai-wiki 2>/tmp/wiki_clone.log; then
            echo "Wiki repo cloned."
          else
            echo "Wiki repo not initialized yet; creating it with an initial Home page."
            cat /tmp/wiki_clone.log
            git init /tmp/aweai-wiki
            git -C /tmp/aweai-wiki remote add origin "${WIKI_URL}"
            cp -f ${GITHUB_WORKSPACE}/wiki/Home.md /tmp/aweai-wiki/Home.md
          fi
          cd /tmp/aweai-wiki
          git checkout -B master 2>/dev/null || true

          # Copy every wiki page from the repo.
          cp -f ${GITHUB_WORKSPACE}/wiki/*.md .
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "docs: sync wiki pages from main (${GITHUB_SHA::7})"
            git push origin master 2>&1 || git push --set-upstream origin master 2>&1
          fi
